<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RemoteBridge</title>
  <style>
    body { margin: 0; background: black; }
    /* touch-action: none stops Safari from scrolling or zooming the page,
       so every touch on the video reaches the pointer handlers. */
    video { width: 100vw; height: 100vh; object-fit: contain; touch-action: none; }
    #status {
      position: fixed; top: 6px; left: 6px; z-index: 1;
      color: #9f9; font: 12px/1.3 monospace; white-space: pre;
      background: rgba(0, 0, 0, 0.6); padding: 4px 6px;
    }
    #keyboard {
      position: fixed; bottom: 12px; right: 12px; z-index: 1;
      color: #9f9; font: 14px monospace; padding: 10px 14px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid #9f9; border-radius: 6px;
    }
    #pairing {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
      z-index: 2; max-width: 90vw; text-align: center;
      color: #9f9; font: 16px/1.5 monospace; padding: 14px 18px;
      background: rgba(0, 0, 0, 0.85); border: 1px solid #9f9; border-radius: 6px;
    }
    #pairing[hidden] { display: none; }
    #pairing .code { font-size: 28px; letter-spacing: 2px; }
    /* Invisible but focusable, so focusing it brings up the phone's
       keyboard. 16px stops Safari zooming the page in on focus. */
    #typing {
      position: fixed; top: 0; left: 0; width: 1px; height: 1px;
      opacity: 0; border: 0; padding: 0; font-size: 16px;
    }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline muted></video>
  <div id="status">connecting to signaling...</div>
  <div id="pairing" hidden></div>
  <button id="keyboard">kbd</button>
  <input id="typing" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" aria-label="type on the remote screen">
  <script type="module">
    import {
      frameRect, framePosition, createMouse, createTrackpad,
      keyMessage, typingMessage, SENTINEL,
    } from "./input.mjs";
    import { fingerprintFromSdp, pairingCode } from "./pairing.mjs";

    // The signaling server is whatever server served this page, so the same
    // file works from localhost, a LAN IP, or a VPS. wss on an https page,
    // ws otherwise (browsers block ws from https pages). location.host keeps
    // the port, so it also works behind a proxy on 443.
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const params = new URLSearchParams(location.search);
    // The shared secret rides along from the page URL: open
    // http://<server>/?token=<secret>. Empty when the server has no token.
    const token = params.get("token") || "";
    // ?relay=1 restricts the connection to TURN-relayed candidates only, to
    // prove the relay works. Same idea as the host's --relay flag.
    const forceRelay = params.get("relay") === "1";
    const SIGNALING_URL =
      wsProtocol + "//" + location.host + "/ws?role=viewer&token=" + encodeURIComponent(token);

    // Pairing (see host/src/pairing.rs). This browser keeps one DTLS
    // certificate in IndexedDB so the host recognises it next time, and
    // remembers the host's fingerprint so a different key on the other end
    // (a relay in the middle, or a reinstalled host) is refused instead of
    // trusted. Browsers can store an RTCCertificate object directly; its
    // private key never leaves the browser.
    const CERT_LIFETIME_MS = 365 * 24 * 3600 * 1000;
    const HOST_FP_KEY = "remotebridge-host-fingerprint";

    function openKeyStore() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("remotebridge", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("keys");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function keyStoreRequest(db, mode, run) {
      return new Promise((resolve, reject) => {
        const request = run(db.transaction("keys", mode).objectStore("keys"));
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // A stored certificate past its expiry is replaced, which means pairing
    // this device again. If storing fails, the page still works but pairs
    // as a new device every visit.
    async function loadCertificate() {
      let db = null;
      try {
        db = await openKeyStore();
        const stored = await keyStoreRequest(db, "readonly", (s) => s.get("certificate"));
        if (stored && stored.expires > Date.now() + 24 * 3600 * 1000) return stored;
      } catch (e) {
        console.warn("no stored certificate:", e);
      }
      const cert = await RTCPeerConnection.generateCertificate({
        name: "ECDSA", namedCurve: "P-256", expires: CERT_LIFETIME_MS,
      });
      try {
        if (db) await keyStoreRequest(db, "readwrite", (s) => s.put(cert, "certificate"));
      } catch (e) {
        console.warn("could not store certificate:", e);
      }
      return cert;
    }

    function savedHostFingerprint() {
      try { return localStorage.getItem(HOST_FP_KEY); } catch { return null; }
    }
    function saveHostFingerprint(fp) {
      try { localStorage.setItem(HOST_FP_KEY, fp); } catch { /* not remembered */ }
    }

    const pairingEl = document.getElementById("pairing");
    function showPairing(lines, code) {
      pairingEl.replaceChildren();
      for (const line of lines) {
        const div = document.createElement("div");
        div.textContent = line;
        pairingEl.append(div);
      }
      if (code) {
        const div = document.createElement("div");
        div.className = "code";
        div.textContent = code;
        pairingEl.insertBefore(div, pairingEl.children[1] || null);
      }
      pairingEl.hidden = false;
    }

    function showHostChanged() {
      showPairing([
        "The host's key is not the one this device paired with.",
        "Someone may be intercepting the connection, or the host was reinstalled.",
        "Not connecting.",
      ]);
      const forget = document.createElement("button");
      forget.textContent = "forget the saved host and pair again";
      forget.addEventListener("click", () => {
        try { localStorage.removeItem(HOST_FP_KEY); } catch { /* nothing saved */ }
        location.reload();
      });
      pairingEl.append(forget);
    }

    const certificate = await loadCertificate();

    const video = document.getElementById("remote");
    let iceServers = null;
    let pc = null;
    let inputChannel = null;
    let eventsSent = 0;
    let answerState = "waiting for offer";
    let render = () => {};

    // Once a second, a line of receive stats from the browser's own WebRTC
    // counters, to see where delay comes from: path (host = direct, relay =
    // through coturn) and round trip, frames per second and bitrate
    // arriving, and how long the browser holds frames before showing them
    // (its jitter buffer). Deltas are over the last second.
    let statsLine = "";
    let lastVideo = null;
    setInterval(async () => {
      if (!pc || pc.connectionState !== "connected") return;
      try {
        statsLine = await readStats(pc);
      } catch (e) {
        // Shown rather than swallowed: a phone has no console to look in.
        statsLine = "stats error: " + e;
      }
      render();
    }, 1000);

    async function readStats(pc) {
      const report = await pc.getStats();
      let video = null;
      let pair = null;
      report.forEach((s) => {
        if (s.type === "inbound-rtp" && s.kind === "video") video = s;
        if (s.type === "transport" && s.selectedCandidatePairId) pair = report.get(s.selectedCandidatePairId);
      });
      if (!pair) report.forEach((s) => { if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") pair = s; });
      const parts = [];
      if (pair) {
        const local = report.get(pair.localCandidateId);
        const remote = report.get(pair.remoteCandidateId);
        parts.push("path " + (local ? local.candidateType : "?") + "-" + (remote ? remote.candidateType : "?"));
        if (pair.currentRoundTripTime !== undefined) parts.push("rtt " + Math.round(pair.currentRoundTripTime * 1000) + "ms");
      }
      if (video && lastVideo) {
        const seconds = (video.timestamp - lastVideo.timestamp) / 1000;
        const emitted = video.jitterBufferEmittedCount - lastVideo.jitterBufferEmittedCount;
        parts.push(Math.round((video.framesDecoded - lastVideo.framesDecoded) / seconds) + "fps");
        parts.push(Math.round((video.bytesReceived - lastVideo.bytesReceived) * 8 / 1000 / seconds) + "kbit/s");
        if (emitted > 0) {
          parts.push("buffer " + Math.round((video.jitterBufferDelay - lastVideo.jitterBufferDelay) / emitted * 1000) + "ms");
        }
        parts.push("lost " + (video.packetsLost || 0) + " freezes " + (video.freezeCount || 0));
      }
      lastVideo = video;
      return parts.join(" ");
    }

    // Input. The gesture and key logic lives in input.mjs, without the DOM,
    // so it can be tested in Node; this part feeds it real events and sends
    // what it returns.
    function frame() {
      return frameRect(video.videoWidth, video.videoHeight, video.getBoundingClientRect());
    }

    function sendInput(msg) {
      if (!inputChannel || inputChannel.readyState !== "open") return;
      inputChannel.send(JSON.stringify(msg));
      eventsSent += 1;
      render();
    }

    const mouse = createMouse(sendInput);
    const trackpad = createTrackpad(sendInput, frame);
    for (const type of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) {
      video.addEventListener(type, (event) => {
        if (event.pointerType !== "touch") {
          const pos = framePosition(frame(), event.clientX, event.clientY);
          if (mouse.handle(event, pos)) video.setPointerCapture(event.pointerId);
        } else if (type === "pointerdown") {
          trackpad.down(event);
          video.setPointerCapture(event.pointerId);
        } else if (type === "pointermove") {
          trackpad.move(event);
        } else {
          trackpad.up(event);
        }
      });
    }

    const typing = document.getElementById("typing");
    document.addEventListener("keydown", (event) => {
      const msg = keyMessage(event, event.target === typing);
      if (!msg) return;
      sendInput(msg);
      // Keep the browser from acting on the key too: space scrolling,
      // Tab moving focus, Cmd+R reloading. Some shortcuts (Cmd+W, Cmd+Q)
      // the browser keeps for itself and never lets a page stop.
      event.preventDefault();
    });

    function resetTyping() {
      typing.value = SENTINEL;
      typing.setSelectionRange(1, 1);
    }
    typing.addEventListener("input", () => {
      const msg = typingMessage(typing.value);
      if (msg) sendInput(msg);
      resetTyping();
    });
    typing.addEventListener("focus", resetTyping);

    // The button toggles the phone's keyboard. Focus has to happen inside
    // the tap's own handler, or iOS will not show the keyboard. Whether the
    // field had focus is read on pointerdown, before pressing the button can
    // take focus away from it. Cancelling mousedown keeps the button itself
    // from taking focus on a computer, where a focused button would be
    // clicked again by every Enter typed for the Mac.
    const keyboardButton = document.getElementById("keyboard");
    let typingWasFocused = false;
    keyboardButton.addEventListener("pointerdown", () => {
      typingWasFocused = document.activeElement === typing;
    });
    keyboardButton.addEventListener("mousedown", (event) => event.preventDefault());
    keyboardButton.addEventListener("click", () => {
      if (typingWasFocused) {
        typing.blur();
      } else {
        typing.focus();
      }
    });

    // Built fresh for every offer. The ICE servers (including the
    // short-lived TURN credentials) come from the server's config message,
    // which always arrives before any offer. Public STUN is listed here too,
    // same as the host (webrtc_host.rs).
    function createPeerConnection(serverIceServers) {
      const peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }, ...serverIceServers],
        iceTransportPolicy: forceRelay ? "relay" : "all",
        certificates: [certificate],
      });
      peer.ontrack = (event) => {
        video.srcObject = event.streams[0];
      };

      // The host creates the "input" channel before its offer, so it arrives
      // here rather than being created on this side.
      peer.ondatachannel = (event) => {
        if (event.channel.label !== "input") return;
        inputChannel = event.channel;
        inputChannel.onopen = render;
        inputChannel.onclose = render;
      };

      // Small on-screen status so a phone, with no console, still shows why a
      // connection fails: connection/ICE state and the kinds of candidate
      // this side gathered (host, srflx from STUN, relay from TURN).
      const seen = {};
      const statusEl = document.getElementById("status");
      render = () => {
        statusEl.textContent =
          "connection: " + peer.connectionState + "\n" +
          "ice: " + peer.iceConnectionState + "\n" +
          "answer: " + answerState + "\n" +
          "candidates: " + (Object.entries(seen).map(([k, v]) => k + "=" + v).join(" ") || "none") + "\n" +
          "input: " + (inputChannel ? inputChannel.readyState : "none") + " (events sent: " + eventsSent + ")" +
          (forceRelay ? "\nrelay-only mode" : "") +
          (statsLine ? "\n" + statsLine : "");
      };
      peer.onicecandidate = (event) => {
        if (event.candidate) {
          const type = event.candidate.type || "unknown";
          seen[type] = (seen[type] || 0) + 1;
          render();
        }
      };
      peer.onconnectionstatechange = () => {
        // Connected means the host accepted this device, so the host's key
        // is now the one to expect from here on.
        if (peer.connectionState === "connected" && peer === pc) {
          if (!savedHostFingerprint() && peer.hostFingerprint) saveHostFingerprint(peer.hostFingerprint);
          pairingEl.hidden = true;
        }
        render();
      };
      peer.oniceconnectionstatechange = render;
      render();
      return peer;
    }

    // Without trickle ICE the answer carries every candidate, so it waits for
    // gathering. But gathering only completes once every STUN/TURN server has
    // answered or timed out, and one slow server can push that past ICE's own
    // ~30 s failure timeout: the phone then fails before the host ever gets
    // the answer. So send after at most maxMs with whatever has been gathered
    // (host, srflx and UDP relay candidates arrive within a second or two).
    function waitForIceGathering(peer, maxMs) {
      if (peer.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => {
          clearTimeout(timer);
          peer.removeEventListener("icegatheringstatechange", check);
          resolve();
        };
        const check = () => {
          if (peer.iceGatheringState === "complete") done();
        };
        const timer = setTimeout(done, maxMs);
        peer.addEventListener("icegatheringstatechange", check);
      });
    }

    const ws = new WebSocket(SIGNALING_URL);
    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      // The server always sends this first, before any offer.
      if (msg.type === "config") {
        iceServers = msg.ice_servers || [];
        return;
      }
      if (msg.type !== "offer" || !iceServers) return;

      // Every offer starts a new session on the host, with its own peer
      // connection there, so this side starts over too. A second offer can
      // arrive while this one is still gathering (the host restarted the
      // session); checking peer === pc after each wait drops the stale one.
      if (pc) pc.close();
      pc = null;
      inputChannel = null;

      const hostFp = fingerprintFromSdp(msg.sdp);
      const savedFp = savedHostFingerprint();
      if (!hostFp || (savedFp && savedFp !== hostFp)) {
        showHostChanged();
        return;
      }

      const peer = createPeerConnection(iceServers);
      peer.hostFingerprint = hostFp;
      pc = peer;

      await peer.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      if (peer !== pc) return;

      // Shown until the connection is up. A device the host already knows
      // connects straight away, so the box only stays up while the host is
      // asking for approval.
      const viewerFp = fingerprintFromSdp(peer.localDescription.sdp);
      showPairing(
        ["Pairing code", "If the host asks, check that it shows the same code and approve it there."],
        pairingCode(hostFp, viewerFp),
      );

      answerState = "gathering";
      render();
      await waitForIceGathering(peer, 3000);
      if (peer !== pc) return;

      // session echoes the offer's, so the host can tell this answer apart
      // from one meant for an offer it has already replaced.
      ws.send(JSON.stringify({ type: "answer", sdp: peer.localDescription.sdp, session: msg.session }));
      answerState = "sent (gathering " + peer.iceGatheringState + ")";
      render();
    };
  </script>
</body>
</html>
