<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RemoteBridge</title>
  <style>
    body { margin: 0; background: black; }
    /* touch-action: none stops Safari from scrolling or zooming the page,
       so every touch on the video reaches the pointer handlers. */
    video { width: 100vw; height: 100vh; object-fit: contain; touch-action: none; }
    #status {
      position: fixed; top: 6px; left: 6px; z-index: 1;
      color: #9f9; font: 12px/1.3 monospace; white-space: pre;
      background: rgba(0, 0, 0, 0.6); padding: 4px 6px;
    }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline muted></video>
  <div id="status">connecting to signaling...</div>
  <script>
    // The signaling server is whatever server served this page, so the same
    // file works from localhost, a LAN IP, or a VPS. wss on an https page,
    // ws otherwise (browsers block ws from https pages). location.host keeps
    // the port, so it also works behind a proxy on 443.
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const params = new URLSearchParams(location.search);
    // The shared secret rides along from the page URL: open
    // http://<server>/?token=<secret>. Empty when the server has no token.
    const token = params.get("token") || "";
    // ?relay=1 restricts the connection to TURN-relayed candidates only, to
    // prove the relay works. Same idea as the host's --relay flag.
    const forceRelay = params.get("relay") === "1";
    const SIGNALING_URL =
      wsProtocol + "//" + location.host + "/ws?role=viewer&token=" + encodeURIComponent(token);

    const video = document.getElementById("remote");
    let iceServers = null;
    let pc = null;
    let inputChannel = null;
    let eventsSent = 0;
    let answerState = "waiting for offer";
    let render = () => {};

    // Input. Positions and distances go to the host as fractions (0..1) of
    // the video frame, so this page never needs the Mac's screen size; the
    // host maps them to screen points (host/src/input.rs). The page
    // letterboxes the frame (object-fit: contain), so fractions are measured
    // against the area the video is actually drawn in, not the whole element.
    function frameRect() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;
      const rect = video.getBoundingClientRect();
      const scale = Math.min(rect.width / vw, rect.height / vh);
      return {
        left: rect.left + (rect.width - vw * scale) / 2,
        top: rect.top + (rect.height - vh * scale) / 2,
        width: vw * scale,
        height: vh * scale,
      };
    }

    function framePosition(event) {
      const frame = frameRect();
      if (!frame) return null;
      return {
        x: (event.clientX - frame.left) / frame.width,
        y: (event.clientY - frame.top) / frame.height,
      };
    }

    function sendInput(msg) {
      if (!inputChannel || inputChannel.readyState !== "open") return;
      inputChannel.send(JSON.stringify(msg));
      eventsSent += 1;
      render();
    }

    const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
    function sendPosition(type, pos) {
      sendInput({ type, x: clamp01(pos.x), y: clamp01(pos.y) });
    }

    // A mouse (a browser on a computer) points directly: the left button
    // presses, drags and releases at the pointer's position.
    let mouseDown = false;
    function onMouse(event) {
      if (event.type === "pointerdown") {
        if (event.button !== 0) return;
        const pos = framePosition(event);
        // A press on the black bars around the video is not on the screen.
        if (!pos || pos.x < 0 || pos.x > 1 || pos.y < 0 || pos.y > 1) return;
        mouseDown = true;
        // Keep receiving moves and the final up even if the pointer leaves
        // the video element.
        video.setPointerCapture(event.pointerId);
        sendPosition("down", pos);
        return;
      }
      if (!mouseDown) return;
      const pos = framePosition(event);
      if (event.type === "pointermove") {
        if (pos) sendPosition("move", pos);
        return;
      }
      // pointerup or pointercancel: either way the button is released.
      mouseDown = false;
      if (pos) sendPosition("up", pos);
    }

    // A touchscreen acts as a trackpad. Pointing directly with a finger at a
    // phone-sized picture of the Mac's screen hides the target and lands a
    // few points off; moving the cursor relatively does not, and the video
    // shows the Mac's cursor, so the finger can be anywhere on the page.
    //   one finger slides: the cursor moves the same distance
    //   one-finger tap: left click (two quick taps: double-click)
    //   tap, then touch again and slide: drag with the left button held
    //   two-finger tap: right click
    //   two fingers slide: scroll, the content following the fingers
    const TAP_SLOP_PX = 10;        // a finger moving less than this is still tapping
    const TAP_MAX_MS = 300;        // a touch held longer than this is not a tap
    const DRAG_AFTER_TAP_MS = 300; // touching again this soon after a tap can drag
    const TRACKPAD_SPEED = 1;      // cursor distance per finger distance

    const touches = new Map(); // pointerId -> latest {x, y} in page pixels
    let gesture = null;        // the current gesture, from first touch to last lift
    let lastTapAt = 0;

    // The fingers' average position. With two fingers this is what moves
    // when they slide together.
    function touchCentre() {
      let x = 0, y = 0;
      for (const t of touches.values()) { x += t.x; y += t.y; }
      return { x: x / touches.size, y: y / touches.size };
    }

    function onTouchDown(event) {
      if (touches.size === 0) {
        gesture = {
          startedAt: event.timeStamp,
          fingers: 1,
          travelled: 0,
          moved: false,
          dragArmed: event.timeStamp - lastTapAt < DRAG_AFTER_TAP_MS,
          dragging: false,
          last: null,
        };
      }
      touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
      video.setPointerCapture(event.pointerId);
      // Once a second finger lands the gesture stays a two-finger one until
      // every finger has lifted, so lifting one finger first does not turn
      // the end of a scroll into a cursor move.
      if (touches.size >= 2 && gesture.fingers === 1) {
        gesture.fingers = 2;
        if (gesture.dragging) {
          gesture.dragging = false;
          sendInput({ type: "release", button: "left" });
        }
      }
      // Measure from here, so a finger landing does not count as the
      // centre moving.
      gesture.last = touchCentre();
    }

    function onTouchMove(event) {
      if (!touches.has(event.pointerId)) return;
      touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const centre = touchCentre();
      const dx = centre.x - gesture.last.x, dy = centre.y - gesture.last.y;
      gesture.last = centre;
      gesture.travelled += Math.hypot(dx, dy);
      // A finger wobbles a little during a tap. Ignoring movement until it
      // passes the slop keeps a tap's click where the cursor was.
      if (!gesture.moved) {
        if (gesture.travelled < TAP_SLOP_PX) return;
        gesture.moved = true;
      }
      const frame = frameRect();
      if (!frame) return;
      const fx = dx / frame.width, fy = dy / frame.height;
      if (gesture.fingers === 2) {
        sendInput({ type: "scroll", dx: fx, dy: fy });
        return;
      }
      if (gesture.dragArmed && !gesture.dragging) {
        gesture.dragging = true;
        sendInput({ type: "press", button: "left" });
      }
      sendInput({ type: "move_rel", dx: fx * TRACKPAD_SPEED, dy: fy * TRACKPAD_SPEED });
    }

    function onTouchUp(event) {
      if (!touches.has(event.pointerId)) return;
      touches.delete(event.pointerId);
      if (touches.size > 0) {
        gesture.last = touchCentre();
        return;
      }
      const ended = gesture;
      gesture = null;
      if (ended.dragging) {
        sendInput({ type: "release", button: "left" });
        return;
      }
      // pointercancel means the browser took the touch for itself (an
      // incoming call, a system gesture): never click for it.
      if (event.type === "pointercancel") return;
      if (ended.moved || event.timeStamp - ended.startedAt > TAP_MAX_MS) return;
      if (ended.fingers === 2) {
        sendInput({ type: "click", button: "right" });
      } else {
        sendInput({ type: "click", button: "left" });
        lastTapAt = event.timeStamp;
      }
    }

    for (const type of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) {
      video.addEventListener(type, (event) => {
        if (event.pointerType !== "touch") {
          onMouse(event);
        } else if (type === "pointerdown") {
          onTouchDown(event);
        } else if (type === "pointermove") {
          onTouchMove(event);
        } else {
          onTouchUp(event);
        }
      });
    }

    // Built fresh for every offer. The ICE servers (including the
    // short-lived TURN credentials) come from the server's config message,
    // which always arrives before any offer. Public STUN is listed here too,
    // same as the host (webrtc_host.rs).
    function createPeerConnection(serverIceServers) {
      const peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }, ...serverIceServers],
        iceTransportPolicy: forceRelay ? "relay" : "all",
      });
      peer.ontrack = (event) => {
        video.srcObject = event.streams[0];
      };

      // The host creates the "input" channel before its offer, so it arrives
      // here rather than being created on this side.
      peer.ondatachannel = (event) => {
        if (event.channel.label !== "input") return;
        inputChannel = event.channel;
        inputChannel.onopen = render;
        inputChannel.onclose = render;
      };

      // Small on-screen status so a phone, with no console, still shows why a
      // connection fails: connection/ICE state and the kinds of candidate
      // this side gathered (host, srflx from STUN, relay from TURN).
      const seen = {};
      const statusEl = document.getElementById("status");
      render = () => {
        statusEl.textContent =
          "connection: " + peer.connectionState + "\n" +
          "ice: " + peer.iceConnectionState + "\n" +
          "answer: " + answerState + "\n" +
          "candidates: " + (Object.entries(seen).map(([k, v]) => k + "=" + v).join(" ") || "none") + "\n" +
          "input: " + (inputChannel ? inputChannel.readyState : "none") + " (events sent: " + eventsSent + ")" +
          (forceRelay ? "\nrelay-only mode" : "");
      };
      peer.onicecandidate = (event) => {
        if (event.candidate) {
          const type = event.candidate.type || "unknown";
          seen[type] = (seen[type] || 0) + 1;
          render();
        }
      };
      peer.onconnectionstatechange = render;
      peer.oniceconnectionstatechange = render;
      render();
      return peer;
    }

    // Without trickle ICE the answer carries every candidate, so it waits for
    // gathering. But gathering only completes once every STUN/TURN server has
    // answered or timed out, and one slow server can push that past ICE's own
    // ~30 s failure timeout: the phone then fails before the host ever gets
    // the answer. So send after at most maxMs with whatever has been gathered
    // (host, srflx and UDP relay candidates arrive within a second or two).
    function waitForIceGathering(peer, maxMs) {
      if (peer.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => {
          clearTimeout(timer);
          peer.removeEventListener("icegatheringstatechange", check);
          resolve();
        };
        const check = () => {
          if (peer.iceGatheringState === "complete") done();
        };
        const timer = setTimeout(done, maxMs);
        peer.addEventListener("icegatheringstatechange", check);
      });
    }

    const ws = new WebSocket(SIGNALING_URL);
    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      // The server always sends this first, before any offer.
      if (msg.type === "config") {
        iceServers = msg.ice_servers || [];
        return;
      }
      if (msg.type !== "offer" || !iceServers) return;

      // Every offer starts a new session on the host, with its own peer
      // connection there, so this side starts over too. A second offer can
      // arrive while this one is still gathering (the host restarted the
      // session); checking peer === pc after each wait drops the stale one.
      if (pc) pc.close();
      inputChannel = null;
      const peer = createPeerConnection(iceServers);
      pc = peer;

      await peer.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      answerState = "gathering";
      render();
      await waitForIceGathering(peer, 3000);
      if (peer !== pc) return;

      // session echoes the offer's, so the host can tell this answer apart
      // from one meant for an offer it has already replaced.
      ws.send(JSON.stringify({ type: "answer", sdp: peer.localDescription.sdp, session: msg.session }));
      answerState = "sent (gathering " + peer.iceGatheringState + ")";
      render();
    };
  </script>
</body>
</html>
