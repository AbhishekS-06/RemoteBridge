<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RemoteBridge</title>
  <style>
    body { margin: 0; background: black; }
    video { width: 100vw; height: 100vh; object-fit: contain; }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline muted></video>
  <script>
    // location.hostname works as long as this page itself was loaded from
    // the Mac's LAN IP rather than localhost -- see the run instructions.
    const SIGNALING_URL = "ws://" + location.hostname + ":8080/ws?role=viewer";

    const pc = new RTCPeerConnection();
    const video = document.getElementById("remote");
    pc.ontrack = (event) => {
      video.srcObject = event.streams[0];
    };

    function waitForIceGatheringComplete(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        pc.addEventListener("icegatheringstatechange", function check() {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        });
      });
    }

    const ws = new WebSocket(SIGNALING_URL);
    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type !== "offer") return;

      await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      // No trickle ICE for v1 (same LAN) -- wait for gathering to finish so
      // the answer already has every host candidate embedded.
      await waitForIceGatheringComplete(pc);

      ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription.sdp }));
    };
  </script>
</body>
</html>
