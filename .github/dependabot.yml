# Weekly dependency update PRs, one grouped PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /host
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    # host/vendor/webrtc-dtls is a patched copy of webrtc-dtls 0.10.0 (the
    # version webrtc 0.11 uses). A webrtc upgrade must be done by hand, so the
    # patch can be checked and removed once upstream has the fix.
    ignore:
      - dependency-name: "webrtc"
      - dependency-name: "webrtc-*"
      # Only patch updates (1.53.1 -> 1.53.3). Larger bumps can change APIs:
      # screencapturekit 11 and tokio-tungstenite 0.30 broke the build. For a
      # 0.x crate, 0.21 -> 0.30 is a minor bump by number but breaking in
      # Cargo, so minor is skipped too. Those are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: gomod
    directory: /signaling
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # Base images in signaling/Dockerfile (Go toolchain, distroless).
  - package-ecosystem: docker
    directory: /signaling
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
