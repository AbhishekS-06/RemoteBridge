name: Signaling image

# A version tag (v0.4.0) builds the signaling server image and publishes it
# to GitHub's container registry as ghcr.io/<owner>/remotebridge-signaling,
# tagged 0.4.0 and latest. A pull request that touches the server or the
# page only builds it, so a broken Dockerfile shows up before merging.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "signaling/**"
      - "client/**"
      - ".dockerignore"
      - ".github/workflows/image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Signaling image (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image name and tags: v0.4.0 -> 0.4.0 and latest. The registry needs
      # a lowercase name, which metadata-action takes care of.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/remotebridge-signaling
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: signaling/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
