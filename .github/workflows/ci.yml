name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR branch cancels the run still going for the older commit.
# Runs on main are never cancelled, so every merged commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signaling:
    name: Signaling server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest Go release, not the go.mod minimum (1.22, out of support):
          # govulncheck flags standard library bugs fixed only in newer Go.
          go-version: stable
          cache-dependency-path: signaling/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Fails only when the code actually calls a known-vulnerable function.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  host:
    name: Host agent (Rust, macOS)
    # ScreenCaptureKit only exists on macOS, so the host cannot build on Linux.
    # macOS 26: apple-metal (via screencapturekit) compiles Swift that needs
    # the macOS 26 SDK; the macos-15 image's SDK lacks those Metal APIs.
    runs-on: macos-26
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode and SDK
        run: xcodebuild -version && xcrun --show-sdk-version
      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
