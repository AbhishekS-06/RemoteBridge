name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signaling:
    name: Signaling server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signaling/go.mod
          cache-dependency-path: signaling/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  host:
    name: Host agent (Rust, macOS)
    # ScreenCaptureKit only exists on macOS, so the host cannot build on Linux.
    # macOS 26: apple-metal (via screencapturekit) compiles Swift that needs
    # the macOS 26 SDK; the macos-15 image's SDK lacks those Metal APIs.
    runs-on: macos-26
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and SDK
        run: xcodebuild -version && xcrun --show-sdk-version
      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --locked
      - run: cargo test --locked
